[project]
name = "prism-api"
version = "0.0.0"
description = "Prism orchestration service — self-corrective multimodal RAG"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "alembic>=1.14",
    "redis>=5.2",
    "httpx>=0.28",
    "structlog>=24.4",
    "pypdf>=6.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0",
    "pypdfium2>=5.13.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.21",
    "numpy>=2.0",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prism"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A test asserting on what landed on disk is not starving an event loop.
"tests/*" = ["ASYNC240"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["prism"]

# pypdfium2 ships no py.typed; it is a ctypes binding to pdfium, so there is
# nothing upstream to wait for. Confined to prism.ingestion.render.
[[tool.mypy.overrides]]
module = ["pypdfium2.*"]
ignore_missing_imports = true

# onnxruntime ships no py.typed. Confined to prism.rerank.onnx.
[[tool.mypy.overrides]]
module = ["onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
    "integration: requires docker compose services (deselect with -m 'not integration')",
    "ollama: additionally requires a local Ollama with the embedding and vision models pulled",
    "reranker: requires the reranker weights (`make reranker-fetch`)",
]
