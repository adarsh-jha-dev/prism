# The documents the golden set is written against.
#
# The PDFs themselves are NOT committed — they live in `eval/corpus/`, which is
# gitignored. This manifest is what makes a run reproducible: `make eval-ingest`
# verifies every file against its digest before writing anything, so a corpus
# that has drifted fails the run instead of quietly changing the benchmark.
#
# Fetched from arXiv on 2026-09-11. The unversioned arXiv URL serves the latest
# revision, so a refetch may not match these digests if a paper is revised —
# that is the failure the digest exists to make loud rather than silent.
#
# To add a paper:
#   1. drop the PDF in eval/corpus/
#   2. shasum -a 256 eval/corpus/<file>.pdf
#   3. add the entry below

version: 1

