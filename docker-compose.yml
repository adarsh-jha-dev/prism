name: prism

# Ollama is not a service here — it runs on the host for the host's GPU, and the
# api container reaches it via host.docker.internal.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: prism-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prism}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prism}
      POSTGRES_DB: ${POSTGRES_DB:-prism}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # 127.0.0.1, so the check fails until Postgres accepts TCP, not just the
      # bootstrap unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-prism} -d ${POSTGRES_DB:-prism}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: prism-redis
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6380}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot; api waits on it completing.
  migrate:
    build:
      context: ./services/api
    container_name: prism-migrate
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prism}:${POSTGRES_PASSWORD:-prism}@postgres:5432/${POSTGRES_DB:-prism}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./services/api
    container_name: prism-api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    environment:
      PRISM_ENV: ${PRISM_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-prism}:${POSTGRES_PASSWORD:-prism}@postgres:5432/${POSTGRES_DB:-prism}
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL_CONTAINER:-http://host.docker.internal:11434}
      # The default lane is local and free; only an explicit VISION_LANE=gemini
      # spends money, and only with a key.
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_LANE: ${VISION_LANE:-ollama}
      VISION_OLLAMA_MODEL: ${VISION_OLLAMA_MODEL:-qwen2.5vl:7b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      # A `ready` document whose bytes vanished on rebuild cannot be re-ingested.
      - uploads:/app/var/uploads
    extra_hosts:
      # Needed on Linux; Docker Desktop resolves this already.
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness, not readiness: /health/deps is red until a model is pulled.
      # No curl in python:slim.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: prism-web
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
  redisdata:
  uploads:
