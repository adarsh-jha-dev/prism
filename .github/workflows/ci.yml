name: CI

# No secrets are referenced anywhere in this file: CI must never make a paid call.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U prism -d prism"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30

    env:
      DATABASE_URL: postgresql+psycopg://prism:prism@localhost:5433/prism
      REDIS_URL: redis://localhost:6380/0

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Migrate
        run: uv run alembic upgrade head

      # No Ollama here, so /health/deps reports it down. Nothing asserts otherwise.
      - name: Test
        run: uv run pytest

  web:
    name: web — types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  stack:
    name: stack — /health against compose
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Bring the stack up
        run: docker compose up -d --build --wait

      - name: GET /health
        run: |
          set -euo pipefail
          body=$(curl --fail --silent --show-error http://localhost:8000/health)
          echo "$body"
          echo "$body" | grep -q '"status":"ok"'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down -v
